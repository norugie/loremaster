[project]
name = "loremaster"
version = "0.1.0"
description = "Discord bot that answers lore questions from an Obsidian vault, naming the notes it used."
readme = "README.md"
requires-python = ">=3.15"
# Why each one was chosen: ARCHITECTURE.md §1.
dependencies = [
    "discord-py>=2.7.1",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
    "ruamel-yaml>=0.19.1",
    "watchfiles>=1.3.0",
]

[dependency-groups]
# Like devDependencies in package.json: installed into the Docker image, not needed to run the bot.
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a running Ollama with the models pulled. They are
# skipped by default; run them with `docker compose run --rm app pytest -m integration`.
addopts = ["-m", "not integration"]
markers = ["integration: needs a local Ollama server (not run by default)"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes basics, I: import order, UP: modern syntax, B: likely bugs.
select = ["E", "F", "I", "UP", "B"]
